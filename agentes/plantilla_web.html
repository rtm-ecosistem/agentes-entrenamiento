<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0f1f">
<meta name="color-scheme" content="dark">
<title>Agentes de inversión · La oficina</title>
<style>
:root {
  --fondo: #f3f4f8; --tarjeta: #ffffff; --tarjeta2: #f7f8fb; --texto: #12141a; --suave: #626a7a; --borde: #e6e8ef;
  --sp: #2f7ed8; --acento: #5b4ee6; --acento-suave: #ecebfd; --sube: #08875a; --baja: #d23f31; --aviso: #b06a00;
  --sube-fondo: #e3f5ec; --baja-fondo: #fdecea; --neutro-fondo: #eef0f4; --aviso-fondo: #fff3dc;
  --sombra: 0 1px 2px rgba(18, 20, 26, .04), 0 4px 16px rgba(18, 20, 26, .05);
  --papel: #fbf9f4; --tinta: #1d1b17; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --radio: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0d0f14; --tarjeta: #171a21; --tarjeta2: #1d2129; --texto: #eceef3; --suave: #9aa2b1; --borde: #272c36;
    --sp: #7cc4ff; --acento: #9b91ff; --acento-suave: #26234a; --sube: #3ddc97; --baja: #ff7b6e; --aviso: #f5b84b;
    --sube-fondo: #10291e; --baja-fondo: #321a19; --neutro-fondo: #232833; --aviso-fondo: #30250f;
    --sombra: none; --papel: #16161a; --tinta: #ebe7de;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
a { color: var(--acento); }
button { font: inherit; color: inherit; }
.cab { max-width: 1040px; margin: 0 auto; padding: 18px 16px 6px; display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #6c5ce7, #00b894);
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; flex: none; }
.cab h1 { font-size: 19px; margin: 0; letter-spacing: -.02em; }
.cab .sub { color: var(--suave); font-size: 12.5px; }
nav.pestanas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--tarjeta);
  border-top: 1px solid var(--borde); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
nav.pestanas .dentro { display: flex; gap: 4px; width: 100%; max-width: 560px; }
nav.pestanas button { flex: 1; border: 0; background: none; padding: 6px 4px; border-radius: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--suave); }
nav.pestanas button svg { width: 22px; height: 22px; }
nav.pestanas button[aria-selected="true"] { color: var(--acento); background: var(--acento-suave); }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  nav.pestanas { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--borde); background: var(--fondo); }
  nav.pestanas button { flex-direction: row; justify-content: center; gap: 8px; font-size: 14px; padding: 10px; }
  nav.pestanas button svg { width: 18px; height: 18px; }
}
main { max-width: 1040px; margin: 0 auto; padding: 8px 16px 24px; }
section[hidden] { display: none; }
h2 { font-size: 18px; margin: 26px 2px 10px; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 0 0 6px; }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; box-shadow: var(--sombra); }
.vacio { color: var(--suave); font-style: italic; margin: 0; }
.sube { color: var(--sube) !important; } .baja { color: var(--baja) !important; }
.num { font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 2px 9px;
  border-radius: 999px; background: var(--neutro-fondo); color: var(--suave); white-space: nowrap; }
.chip.positivo, .chip.bien { background: var(--sube-fondo); color: var(--sube); }
.chip.negativo, .chip.mal { background: var(--baja-fondo); color: var(--baja); }
.chip.alta, .chip.ojo { background: var(--aviso-fondo); color: var(--aviso); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 750;
  font-size: 17px; flex: none; position: relative; }
.avatar.xl { width: 72px; height: 72px; font-size: 28px; }
.avatar.xs { width: 22px; height: 22px; font-size: 10px; border: 2px solid var(--tarjeta); }
.avatar.fuera { filter: grayscale(1); opacity: .55; }
.hero { background: linear-gradient(135deg, #5b4ee6 0%, #7d5cf0 45%, #00a884 100%); color: #fff; border-radius: 22px;
  padding: 18px 18px 8px; box-shadow: var(--sombra); }
.hero .titulo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hero .titulo b { font-size: 17px; } .hero .titulo span { font-size: 12px; opacity: .85; }
.fila-agente { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,.18);
  cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; color: #fff; }
.fila-agente:first-of-type { border-top: 0; }
.fila-agente .pos { font-weight: 800; width: 16px; opacity: .8; }
.fila-agente .avatar { box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
.fila-agente .info { flex: 1; min-width: 0; }
.fila-agente .info b { display: block; font-size: 15.5px; }
.fila-agente .info small { opacity: .85; font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila-agente .cifras { text-align: right; }
.fila-agente .cifras b { display: block; font-size: 16px; }
.pildora { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.22); }
.pildora.mal { background: #ffdcd7; color: #9c1c10; } .pildora.bien { background: #d4f7e6; color: #05603f; }
.rejilla { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .rejilla.dos { grid-template-columns: 1.25fr 1fr; } }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--suave); margin-top: 8px; }
.punto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
svg text { fill: var(--suave); font-size: 11.5px; }
.claves { margin: 10px 0 0; padding-left: 18px; } .claves li { margin: 3px 0; }
.concepto { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--acento-suave); }
.concepto small { color: var(--acento); font-weight: 750; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.pendiente { background: var(--aviso-fondo); border: 1px solid var(--aviso); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }

/* Periódico */
.periodico { background: var(--papel); color: var(--tinta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px 16px; }
.cabecera-diario { text-align: center; border-bottom: 3px double var(--tinta); padding-bottom: 10px; margin-bottom: 14px; }
.cabecera-diario .nombre { font-family: var(--serif); font-size: clamp(28px, 7vw, 44px); font-weight: 700; letter-spacing: -.01em; line-height: 1.05; }
.cabecera-diario .fecha { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--suave); margin-top: 6px; }
.editorial { font-family: var(--serif); font-size: 17px; line-height: 1.55; border-bottom: 1px solid var(--borde); padding-bottom: 14px; margin-bottom: 6px; }
.editorial::first-letter { font-size: 2.6em; float: left; line-height: .9; margin: 4px 6px 0 0; font-weight: 700; }
.filtros { position: sticky; top: 0; z-index: 5; background: var(--papel); padding: 10px 0; border-bottom: 1px solid var(--borde); }
@media (min-width: 900px) { .filtros { top: 45px; } }
.buscador { width: 100%; font: inherit; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); }
.grupo-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
.grupo-chips::-webkit-scrollbar { display: none; }
.grupo-chips button { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 999px; padding: 5px 12px; font-size: 13px;
  font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--suave); }
.grupo-chips.sub-equipo { padding-top: 4px; }
#acciones .grupo-chips { flex-wrap: wrap; }  /* cada acción a la vista, sin tener que deslizar */
#acciones .volver-acc { border: 0; background: none; color: var(--suave); font: inherit; font-size: 13px; font-weight: 650; padding: 2px 0; cursor: pointer; }
#acciones .volver-acc:hover { color: var(--texto); }
#acciones .modo-acc { margin-top: 8px; }
#acciones .rangos-acc { display: flex; justify-content: flex-end; margin-top: 6px; }
.grupo-chips.sub-equipo button { font-size: 12px; padding: 3px 10px; }
.grupo-chips button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.selects { display: flex; gap: 8px; padding-top: 8px; flex-wrap: wrap; }
select { font: inherit; font-size: 13.5px; color: var(--texto); background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 7px 10px; max-width: 100%; }
.contador { font-size: 12.5px; color: var(--suave); margin: 10px 0 0; }
.articulo { padding: 16px 0; border-bottom: 1px solid var(--borde); }
.articulo .meta { font-size: 11.5px; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.articulo h4 { font-family: var(--serif); font-size: 20px; line-height: 1.25; margin: 6px 0; font-weight: 700; }
.articulo.alta h4 { font-size: 23px; }
.articulo p { margin: 0 0 8px; font-size: 15px; line-height: 1.55; }
.articulo .pie { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--suave); }
.usada { display: inline-flex; align-items: center; gap: 4px; }
.usada .avatar { margin-left: -6px; } .usada .avatar:first-child { margin-left: 0; }
.mas { display: block; width: 100%; margin-top: 14px; padding: 12px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); font-weight: 650; cursor: pointer; }

/* Agentes */
.selector { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.selector::-webkit-scrollbar { display: none; }
.selector button { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--suave); min-width: 62px; }
.selector button .avatar { width: 52px; height: 52px; font-size: 19px; }
.selector button[aria-pressed="true"] { color: var(--texto); }
.selector button[aria-pressed="true"] .avatar { box-shadow: 0 0 0 3px var(--fondo), 0 0 0 5px var(--acento); }
.perfil { display: flex; gap: 14px; align-items: center; }
.perfil h2 { margin: 0; font-size: 22px; }
.perfil .estrategia-nombre { color: var(--suave); font-weight: 600; }
.perfil .personalidad { font-style: italic; color: var(--suave); margin: 4px 0 0; font-size: 14px; }
.puesto { margin-top: 14px; border-radius: 16px; padding: 14px; }
.puesto.bien { background: var(--sube-fondo); } .puesto.mal { background: var(--baja-fondo); } .puesto.ojo { background: var(--aviso-fondo); }
.puesto b { font-size: 15px; }
.barra { height: 8px; border-radius: 4px; background: rgba(127,127,127,.2); overflow: hidden; margin: 8px 0 4px; }
.barra span { display: block; height: 100%; background: var(--acento); border-radius: 4px; }
.cifras-perfil { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
@media (min-width: 600px) { .cifras-perfil { grid-template-columns: repeat(4, 1fr); } }
.cifra { background: var(--tarjeta2); border-radius: 14px; padding: 10px 12px; }
.cifra small { color: var(--suave); font-size: 12px; display: block; } .cifra b { font-size: 17px; }
.subpestanas { display: flex; gap: 6px; margin: 18px 0 10px; overflow-x: auto; scrollbar-width: none; }
.subpestanas button { border: 0; background: var(--neutro-fondo); border-radius: 999px; padding: 7px 14px; font-weight: 650; font-size: 13.5px; cursor: pointer; color: var(--suave); white-space: nowrap; }
.subpestanas button[aria-pressed="true"] { background: var(--texto); color: var(--fondo); }
details.informe { border-bottom: 1px solid var(--borde); padding: 12px 0; }
details.informe:last-child { border-bottom: 0; }
details.informe summary { cursor: pointer; list-style: none; }
details.informe summary::-webkit-details-marker { display: none; }
details.informe .cab-informe { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--suave); font-weight: 600; }
details.informe .resumen { margin-top: 4px; font-weight: 600; }
details.informe .resumen::after { content: " Leer informe ›"; color: var(--acento); font-weight: 600; font-size: 13px; }
details.informe[open] .resumen::after { content: ""; }
.bloque { margin-top: 10px; } .bloque small { display: block; font-size: 11.5px; font-weight: 750; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; }
.bloque p { margin: 2px 0 0; }
.op { display: flex; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--tarjeta2); margin-top: 6px; font-size: 14px; }
.op .lado { font-weight: 750; white-space: nowrap; }
.rechazo { color: var(--aviso); font-size: 13.5px; margin-top: 6px; }
.ajuste { color: var(--suave); font-size: 13px; margin-top: 6px; }
.tabla { width: 100%; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; } th { color: var(--suave); font-weight: 600; }
.estrategia ul { padding-left: 18px; margin: 6px 0; } .estrategia p { margin: 6px 0; }
.carta { font-family: var(--serif); font-size: 16px; line-height: 1.6; background: var(--papel); color: var(--tinta); border-radius: 14px; padding: 14px 16px; border: 1px solid var(--borde); }
.operacion { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--borde); }
.operacion:last-child { border-bottom: 0; }
.operacion .cuerpo { flex: 1; min-width: 0; }
.operacion .cuerpo p { margin: 3px 0 0; font-size: 13.5px; color: var(--suave); }
footer { max-width: 1040px; margin: 0 auto; padding: 8px 16px 24px; color: var(--suave); font-size: 12px; }

/* Oficina */
.cab { max-width: 1500px; flex-wrap: wrap; }
.cab .tit { flex: 1; min-width: 0; }
.estado-bolsa { font-size: 12.5px; font-weight: 650; padding: 5px 11px; border-radius: 999px; background: var(--neutro-fondo); color: var(--suave); white-space: nowrap; }
.cab .estado-bolsa { cursor: pointer; } .hoy.quitada { display: none; }
.estado-bolsa.abierta { background: var(--sube-fondo); color: var(--sube); }
.estado-bolsa.pre { background: var(--aviso-fondo); color: var(--aviso); }
.hora-precios { white-space: normal; }
.luz { font-weight: 700; } .luz.ok { color: var(--sube); } .luz.espera { color: var(--aviso); } .luz.mal { color: var(--baja); }
.novedades { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); z-index: 60; display: flex; gap: 10px; align-items: center;
  background: var(--acento); color: #fff; border: 0; border-radius: 999px; padding: 9px 16px; font: inherit; font-size: 14px; font-weight: 650;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; max-width: calc(100vw - 32px); }
.novedades[hidden] { display: none; }
.hora-precios { display: block; font-size: 10.5px; font-weight: 600; opacity: .8; line-height: 1.2; }
main.ancho { max-width: 1500px; }
.oficina-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
.oficina-grid .sala { order: -1; min-width: 0; }
@media (min-width: 900px) {
  .oficina-grid { grid-template-columns: 290px minmax(0, 1fr); align-items: start; }
  .oficina-grid .sala { order: 0; grid-column: 2; grid-row: 1; }
  .oficina-grid .plantilla { grid-column: 1; grid-row: 1 / span 2; }
  .oficina-grid .pizarra { grid-column: 2; margin-top: 0; }
  .escena { max-width: calc((100vh - 200px) * 1.43); margin: 0 auto; }
}
@media (max-width: 599px) {
  .estado-bolsa { order: 3; flex-basis: 100%; text-align: center; }
  .bocadillo { font-size: 10.5px; max-width: 62%; padding: 3px 6px; }
  .etiqueta { font-size: 10.5px; }
}
.escena { position: relative; border-radius: var(--radio); overflow: hidden; background: #2b2d42; box-shadow: var(--sombra); user-select: none; -webkit-user-select: none; }
.escena canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
.capa { position: absolute; inset: 0; pointer-events: none; container-type: inline-size; }
.etiqueta { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; border: 0; cursor: pointer;
  background: rgba(15, 17, 26, .78); color: #fff; font-size: 11.5px; font-weight: 700; padding: 2px 7px 2px 5px; border-radius: 999px;
  white-space: nowrap; display: flex; align-items: center; gap: 3px; line-height: 1.35; transition: left .12s linear, top .12s linear; }
.etiqueta[aria-pressed="true"] { background: #fff; color: #12141a; box-shadow: 0 0 0 2px var(--acento); }
.etiqueta .emo { font-size: 12.5px; }
.bocadillo { position: absolute; transform: translate(-50%, calc(-100% - 22px)); max-width: min(230px, 46%); background: #fff; color: #12141a;
  font-size: 11.5px; line-height: 1.35; padding: 5px 8px; border-radius: 9px; box-shadow: 0 2px 8px rgba(0,0,0,.25); pointer-events: none;
  opacity: 0; transition: opacity .35s, left .12s linear, top .12s linear; border: 2px solid #12141a; }
.bocadillo::after { content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #12141a; border-bottom: 0; }
.bocadillo.visible { opacity: 1; }
.etiqueta.sala-analistas { background: linear-gradient(135deg, rgba(91,78,230,.92), rgba(42,157,143,.92)); color: #fff; padding: 3px 9px 3px 5px; font-weight: 700; box-shadow: 0 0 0 1px rgba(255,255,255,.35), 0 4px 14px rgba(91,78,230,.45); }
/* (el tamaño va en proporción a la oficina, así siempre cabe en la pizarra y crece al ampliar) */
.cartel-fondo { position: absolute; transform: translate(-50%, 0) skewY(26.5deg); pointer-events: auto; cursor: pointer; border: 0; background: none;
  display: flex; flex-direction: column; align-items: center; line-height: 1.1; padding: 0; font-family: inherit; }
.cartel-fondo small { font-size: .66cqw; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #4a5160; }
.cartel-fondo b { font-size: 1.05cqw; font-weight: 800; }
.cartel-fondo.sube b { color: #16a34a; } .cartel-fondo.baja b { color: #dc2626; }
.zona { position: absolute; transform: translate(-10%, -50%) skewY(26.5deg); color: rgba(255,255,255,.85); font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.cartel { position: absolute; transform: translate(-50%, -100%); background: #ffe66d; color: #3d2c00; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 4px; border: 2px solid #3d2c00; }
.pie-escena { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--suave); padding: 8px 4px 0; }
.plantilla .tarjeta { padding: 12px; }
.plantilla h2 { margin: 0 2px 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; }
.plantilla h2 small { font-size: 12px; font-weight: 600; color: var(--suave); }
.empleado { display: grid; grid-template-columns: 45px 1fr auto; gap: 4px 10px; align-items: center; width: 100%; text-align: left; border: 0;
  background: var(--tarjeta2); border-radius: 14px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
.empleado[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--acento); }
.empleado.fuera { opacity: .55; filter: grayscale(1); }
.testigo { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 10px; margin: 4px 0;
  border-top: 1px dashed var(--borde); border-bottom: 1px dashed var(--borde); font-size: 13px; }
.testigo small { color: var(--suave); font-size: 12px; } .testigo .valor { text-align: right; } .testigo .valor b { display: block; font-size: 14px; }
.empleado .pix { grid-row: span 2; }
.empleado b { font-size: 14.5px; } .empleado small { color: var(--suave); font-size: 12px; }

const pantallaPequena = () => innerWidth < 700 || innerHeight < 500;
const pct = v => (v >= 0 ? '+' : '') + fmt2.format(v * 100) + ' %';
const puntos = v => (v >= 0 ? '+' : '') + fmt2.format(v * 100) + ' pts';
const signo = v => v > 0.00005 ? 'sube' : (v < -0.00005 ? 'baja' : '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dia = f => f ? new Date(f.slice(0, 10) + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const hora = f => f && f.length > 10 ? new Date(f.endsWith('Z') ? f : f + 'Z').toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '';
const AG = Object.fromEntries(D.agentes.map(a => [a.id, a]));
// Solo quien ya ha invertido puede ir por encima del testigo: los que no han operado nunca van detrás
const encima = a => !a.situacion.sin_invertir && a.situacion.diferencia >= 0;
const activos = D.agentes.filter(a => a.estado === 'activo').sort((a, b) => encima(b) - encima(a) || b.situacion.diferencia - a.situacion.diferencia);
const iniciales = a => a.alias.slice(0, 1).toUpperCase();
const avatar = (a, cls = '') => `<span class="avatar ${cls} ${a.estado === 'activo' ? '' : 'fuera'}" style="background:${a.color}" title="${esc(a.alias)} · ${esc(a.nombre)}">${esc(iniciales(a))}</span>`;
const TIPOS = { economia: 'Economía', empresa: 'Empresas', sector: 'Sectores', materias_primas: 'Materias primas', geopolitica: 'Geopolítica', mercados: 'Mercados', otros: 'Otros' };

function estadoPuesto(a) {
  const s = a.situacion;
  if (a.estado !== 'activo') return { cls: 'mal', texto: 'Despedido' };
  if (s.caida < -D.reglas.max_caida * 0.6) return { cls: 'ojo', texto: 'Cerca del límite de caída' };
  if (s.avisos && s.diferencia <= 0) return { cls: 'mal', texto: 'Con un aviso: no puede volver a quedar por detrás' };
  if (s.diferencia > 0) return { cls: 'bien', texto: s.avisos ? 'Supera al S&P (tiene un aviso)' : 'Supera al S&P' };
  if (s.dias_restantes <= 7) return { cls: 'mal', texto: 'En peligro' };
  return { cls: 'ojo', texto: 'Por detrás del S&P' };
}

function md(texto) {
  let html = '', lista = false;
  for (let l of esc(texto).split('\n')) {
    l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^#\s/.test(l)) continue;
    if (/^\s*[-*]\s/.test(l)) { if (!lista) { html += '<ul>'; lista = true; } html += '<li>' + l.replace(/^\s*[-*]\s/, '') + '</li>'; continue; }
    if (lista) { html += '</ul>'; lista = false; }
    if (l.trim()) html += '<p>' + l + '</p>';
  }
  return html + (lista ? '</ul>' : '');
}

// Con menos de dos días de datos se usa la evolución de hoy, guardada cada 15 minutos
const DIA = () => D.agentes.every(a => a.historial.length < 2) && (D.referencia_hoy || []).length > 1;
function grafico() {
  const porHoras = DIA(), ref = porHoras ? D.referencia_hoy : D.referencia.map(r => [r.fecha, r.precio]);
  const series = D.agentes.filter(a => (porHoras ? a.hoy || [] : a.historial).length).map(a => ({ nombre: a.alias, color: a.color, activo: a.estado === 'activo', puntos: porHoras ? a.hoy : a.historial.map(h => [h.fecha, h.valor]) }));
  if (ref.length) {
    const base = ref[0][1];
    series.push({ nombre: 'Testigo (S&P 500)', color: 'var(--texto)', ref: true, activo: true, puntos: ref.map(([f, p]) => [f, D.reglas.capital * p / base]) });
  }
  const fechas = [...new Set(series.flatMap(s => s.puntos.map(p => p[0])))].sort();
  if (fechas.length < 2) return '<p class="vacio">El gráfico aparecerá en cuanto haya dos actualizaciones de precios.</p>';
  const etiqueta = f => porHoras ? hora(f) : dia(f);
  const vals = series.flatMap(s => s.puntos.map(p => p[1]));
  let min = Math.min(...vals), max = Math.max(...vals);
  const m = Math.max((max - min) * 0.1, 50); min -= m; max += m;
  const W = Math.max(300, Math.min(600, (document.querySelector('main').clientWidth || 600) - 40)), H = 220, L = 46, R = 8, T = 8, B = 22;
  const x = f => L + fechas.indexOf(f) * (W - L - R) / (fechas.length - 1);
  const y = v => T + (max - v) * (H - T - B) / (max - min);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Evolución de cada agente frente al S&P 500">`;
  for (let i = 0; i <= 3; i++) { const v = min + (max - min) * i / 3; svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--borde)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt0.format(v)}</text>`; }
  svg += `<text x="${L}" y="${H - 4}">${etiqueta(fechas[0])}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${porHoras ? 'Hoy · ' : ''}${etiqueta(fechas[fechas.length - 1])}</text>`;
  for (const s of series) {
    const d = s.puntos.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.ref ? 1.5 : 2.5}" stroke-linecap="round" stroke-linejoin="round" ${s.ref ? 'stroke-dasharray="5 4"' : ''} opacity="${s.activo ? 1 : .3}"/>`;
  }
  return svg + '</svg><div class="leyenda">' + series.map(s => `<span><span class="punto" style="background:${s.color};opacity:${s.activo ? 1 : .3}"></span>${esc(s.nombre)}</span>`).join('') + '</div>';
}

/* ---------- Periódico ---------- */
let NOTICIAS = null, FILTRO = { q: '', i: 'todas', m: 'todos', ti: 'todos', em: '', dia: '', usadas: false }, MOSTRAR = 30;
// Primero solo las de hoy y ayer (lo que se lee a diario, mucho más ligero en el móvil); los 30 días, al pedirlos
let NOTICIAS_COMPLETAS = false, CARGANDO_TODAS = null;
async function cargarNoticias() {
  if (NOTICIAS) return;
  try { NOTICIAS = await (await fetch('noticias-recientes.json', { cache: 'no-cache' })).json(); }
  catch (e) { NOTICIAS = null; }
  if (!NOTICIAS) await cargarTodas();  // web generada antes de que existiera el archivo de recientes
}
async function cargarTodas() {
  if (NOTICIAS_COMPLETAS) return;
  CARGANDO_TODAS = CARGANDO_TODAS || (async () => {
    try { NOTICIAS = await (await fetch('noticias.json', { cache: 'no-cache' })).json(); NOTICIAS_COMPLETAS = true; }
    catch (e) { NOTICIAS = NOTICIAS || []; }
    CARGANDO_TODAS = null;
  })();
  return CARGANDO_TODAS;
}
// La búsqueda, los días anteriores o seguir bajando necesitan los 30 días
async function pedirTodas() {
  if (NOTICIAS_COMPLETAS) return;
  const c = document.getElementById('contador'); if (c) c.textContent = 'Cargando los 30 días de noticias…';
  await cargarTodas();
  if (PANEL === 'noticias') pintarNoticias();
}
function filtrar() {
  const q = FILTRO.q.trim().toLowerCase();
  return NOTICIAS.filter(n => (FILTRO.i === 'todas' || n.i === FILTRO.i) && (FILTRO.m === 'todos' || n.m === FILTRO.m)
    && (FILTRO.ti === 'todos' || n.ti === FILTRO.ti) && (!FILTRO.em || (n.em || []).includes(FILTRO.em))
    && (!FILTRO.dia || n.f.slice(0, 10) === FILTRO.dia) && (!FILTRO.usadas || (n.us || []).length)
    && (!q || (n.t + ' ' + n.e + ' ' + n.o + ' ' + (n.em || []).join(' ')).toLowerCase().includes(q)));
}
function chips(grupo, opciones) {
  return `<div class="grupo-chips" role="group">${opciones.map(([v, t]) => `<button data-filtro="${grupo}" data-valor="${v}" aria-pressed="${String(FILTRO[grupo]) === String(v)}">${t}</button>`).join('')}</div>`;
}
function articulo(n) {
  const imp = { positivo: '▲ Positiva', negativo: '▼ Negativa', mixto: '◆ Mixta', neutral: '● Neutral' }[n.m] || '● Neutral';
  const usadas = (n.us || []).map(id => AG[id]).filter(Boolean);
  return `<article class="articulo ${n.i}">
    <div class="meta"><span>${dia(n.f)} · ${hora(n.f)}</span><span>${esc(TIPOS[n.ti] || 'Otros')}</span>${n.i === 'alta' ? '<span class="chip alta">Importante</span>' : ''}${n.p ? '<span class="chip">Sin analizar</span>' : ''}</div>
    <h4>${esc(n.t)}</h4>${n.e ? `<p>${esc(n.e)}</p>` : ''}
    <div class="pie"><span class="chip ${n.m}">${imp}</span>${(n.em || []).slice(0, 5).map(e => `<span class="chip">${esc(e)}</span>`).join('')}
      ${usadas.length ? `<span class="usada" title="Agentes que la tuvieron en cuenta">${usadas.map(a => avatar(a, 'xs')).join('')} la usaron</span>` : ''}
      ${n.u ? `<a href="${esc(n.u)}" target="_blank" rel="noopener">Original (${esc(n.fu || 'fuente')}) ↗</a>` : ''}</div></article>`;
}
function pintarListaNoticias() {
  const lista = filtrar();

  const dias = [...new Set(NOTICIAS.map(n => n.f.slice(0, 10)))].sort().reverse();

    ${r ? `<div class="editorial">${esc(r.resumen_mercado)}</div>` : ''}
    <div class="filtros">
      <input class="buscador" id="buscar" type="search" placeholder="Buscar: Apple, inflación, petróleo…" value="${esc(FILTRO.q)}" aria-label="Buscar noticias">
      ${chips('i', [['todas', 'Todas'], ['alta', 'Importantes'], ['media', 'Relevantes'], ['baja', 'Menores']])}
      ${chips('m', [['todos', 'Cualquier impacto'], ['positivo', '▲ Positivas'], ['negativo', '▼ Negativas'], ['mixto', '◆ Mixtas']])}
      <div class="selects">
        <select data-filtro="ti" aria-label="Tipo"><option value="todos">Todos los temas</option>${Object.entries(TIPOS).map(([k, v]) => `<option value="${k}" ${FILTRO.ti === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <select data-filtro="em" aria-label="Empresa"><option value="">Todas las empresas</option>${empresas.map(e => `<option ${FILTRO.em === e ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>
        <select data-filtro="dia" aria-label="Día"><option value="">${NOTICIAS_COMPLETAS ? 'Últimos 30 días' : 'Últimos 2 días'}</option>${dias.map(d => `<option value="${d}" ${FILTRO.dia === d ? 'selected' : ''}>${dia(d)}</option>`).join('')}${NOTICIAS_COMPLETAS ? '' : '<option value="__todas">📅 Ver los 30 días…</option>'}</select>
        <select data-filtro="usadas" aria-label="Usadas por agentes"><option value="">Todas</option><option value="1" ${FILTRO.usadas ? 'selected' : ''}>Solo las que usaron los agentes</option></select>
      </div>
      <p class="contador" id="contador"></p>
    </div>
    <div id="lista-noticias"></div><button class="mas" id="ver-mas">Ver más noticias</button></div>`;
  pintarListaNoticias();
  document.getElementById('buscar').oninput = e => {
    FILTRO.q = e.target.value; MOSTRAR = 30; pintarListaNoticias();
    if (FILTRO.q.trim() && !NOTICIAS_COMPLETAS) pedirTodas().then(() => { const b = document.getElementById('buscar'); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } });

  document.getElementById('ver-mas').onclick = () => { if (filtrar().length > MOSTRAR) { MOSTRAR += 30; pintarListaNoticias(); } else pedirTodas(); };
  s.querySelectorAll('select[data-filtro]').forEach(el => el.onchange = () => {
    const k = el.dataset.filtro;
    if (el.value === '__todas') { FILTRO.dia = ''; pedirTodas(); return; }
    FILTRO[k] = k === 'usadas' ? !!el.value : el.value; MOSTRAR = 30; pintarListaNoticias();
  });
  s.querySelectorAll('button[data-filtro]').forEach(b => b.onclick = () => {
    FILTRO[b.dataset.filtro] = b.dataset.valor; MOSTRAR = 30;
    s.querySelectorAll(`button[data-filtro="${b.dataset.filtro}"]`).forEach(x => x.setAttribute('aria-pressed', x === b));
    pintarListaNoticias();
  });
}

const horaCorta = h => new Date(h).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
// Hora a la que empezaron y, si se sabe, a la que estuvo listo (la web lo publica un minuto después)
const momentoAnalistas = x => !x.hora ? dia(x.fecha)
  : dia(x.fecha) + ' · ' + (x.listo ? `empezado ${horaCorta(x.hora)} · listo ${horaCorta(x.listo)}` : horaCorta(x.hora));
function informeAnalistas(x = D.analistas, abierto = true) {
  if (!x) return '<div class="analistas sin-informe"><b>Informe del equipo de analistas</b><p class="vacio">Aún no hay ninguno. Los analistas escriben uno en cada recogida de noticias (8:00, 16:00 y 23:00) y los agentes los leen antes de decidir.</p></div>';
  const tono = { alcista: ['sube', '▲ Optimistas'], bajista: ['baja', '▼ Prudentes'], neutral: ['', '◆ Neutrales'] }[x.tono] || ['', ''];
  return `<details class="analistas" ${abierto ? 'open' : ''}><summary><b>Informe del equipo de analistas</b> · ${momentoAnalistas(x)} <span class="chip ${tono[0]}">${tono[1]}</span>${abierto ? '' : `<div class="resumen">${esc(x.conclusion)}</div>`}</summary>
    <p class="conclusion">${esc(x.conclusion)}</p>
    <div class="rejilla-analistas">
      <div><small>📈 Análisis técnico</small><p>${esc(x.tecnico)}</p></div>
      <div><small>📰 Noticias y economía</small><p>${esc(x.noticias)}</p></div>
      <div><small>🌡️ Sentimiento</small><p>${esc(x.sentimiento)}</p></div>
    </div>
    <div class="debate"><div class="a-favor"><small>🐂 El alcista dice</small><p>${esc(x.alcista)}</p></div><div class="en-contra"><small>🐻 El bajista dice</small><p>${esc(x.bajista)}</p></div></div>
    ${x.valores.length ? `<div class="valores-analistas">${x.valores.map(v => `<span class="chip ${v.vista === 'alcista' ? 'bien' : v.vista === 'bajista' ? 'mal' : ''}" title="${esc(v.motivo)}">${v.vista === 'alcista' ? '▲' : v.vista === 'bajista' ? '▼' : '◆'} ${esc(v.simbolo)}</span>`).join('')}</div>` : ''}
    ${x === D.analistas && (D.eventos || []).length ? `<div class="bloque radar"><small>📅 Eventos grandes · durante la hora siguiente, el equipo intradía decide cada 15 minutos (hora española)</small><ul>${D.eventos.map(e => `<li><b>${dia(e.cuando.slice(0, 10))} · ${horaEspana(e.cuando, e.cuando.slice(11, 16))}</b> ${esc(e.texto)}</li>`).join('')}</ul></div>` : ''}
    ${(x.radar || []).length ? `<div class="bloque radar"><small>📡 Radar de oportunidades · fuera de la lista, máx. 5 % de la cartera en cada una</small><ul>${x.radar.map(v => `<li><b>${esc(v.simbolo)}</b>${v.nombre ? ' · ' + esc(v.nombre) : ''} <span class="num">${usd2(v.precio)}</span><br>${esc(v.motivo)}</li>`).join('')}</ul></div>` : ''}
  </details>`;
}

/* ---------- Filtro por equipos: Todos · Equipo diario · Equipo intradía (y, dentro de cada uno, una persona) ---------- */
const equipoDe = a => a.equipo === 'intradia' ? 'intradia' : 'diario';
function filtroEquipos(f, nombre, conAnalistas, quienes) {
  const boton = (k, v, t) => `<button data-${nombre}-${k}="${v}" aria-pressed="${f[k] === v}">${t}</button>`;
  const fila1 = [boton('eq', 'todos', 'Todos'), ...(conAnalistas ? [boton('eq', 'analistas', '📊 Analistas')] : []), ...EQUIPOS.map(([k, t]) => boton('eq', k, t))].join('');
  const miembros = EQUIPOS.some(([k]) => k === f.eq) ? quienes.filter(a => equipoDe(a) === f.eq) : [];
  const fila2 = miembros.length ? `<div class="grupo-chips sub-equipo">${[boton('quien', '', 'Todo el equipo'), ...miembros.map(a => boton('quien', a.id, esc(a.alias)))].join('')}</div>` : '';
  return `<div class="grupo-chips">${fila1}</div>${fila2}`;
}
function pasaFiltro(f, id) {
  if (f.eq === 'todos') return true;
  if (f.eq === 'analistas') return id === 'analistas';
  const a = AG[id] || D.agentes.find(x => x.id === id);
  return !!a && equipoDe(a) === f.eq && (!f.quien || f.quien === id);
}
function atarFiltro(el, f, nombre, repintar) {
  el.querySelectorAll(`[data-${nombre}-eq]`).forEach(b => b.onclick = () => { f.eq = b.dataset[nombre + 'Eq']; f.quien = ''; repintar(); });
  el.querySelectorAll(`[data-${nombre}-quien]`).forEach(b => b.onclick = () => { f.quien = b.dataset[nombre + 'Quien']; repintar(); });
}

/* ---------- Informes ---------- */
function reglasCambiadas(b) {
  return (b.reglas || []).length ? `<div class="bloque"><small>📓 Cambios en su libreta de reglas</small>${b.reglas.map(r => `<p style="margin:2px 0">${esc(r)}</p>`).join('')}</div>` : '';
}
function aprendizaje(a) {
  const ap = a.aprendizaje || {}, [bien, total] = ap.aciertos || [0, 0];
  let h = '<p class="vacio" style="margin-bottom:10px">Lo que aprende de sí mismo: cada día repasa sus operaciones, apunta o tacha reglas en su libreta y hace una predicción que se corrige a la semana.</p>';
  if (ap.rescate) h += `<div class="bloque" style="margin:0 0 12px"><small>🚨 Plan de rescate · ${dia(ap.rescate.fecha)}</small><p style="margin:2px 0">${esc(ap.rescate.texto)}</p></div>`;

      const p=[now.p[0]+dx,now.p[1]+dy],pk=key(p),g=now.g+Math.hypot(dx,dy);
      if(closed.has(pk)||!libreOficina(p[0]/4,p[1]/4)||g>=(scores.get(pk)??Infinity))continue;
      if(dx&&dy&&(!libreOficina((now.p[0]+dx)/4,now.p[1]/4)||!libreOficina(now.p[0]/4,(now.p[1]+dy)/4)))continue;
      parents.set(pk,nk);scores.set(pk,g);open.push({p,g,f:g+Math.hypot(p[0]-end[0],p[1]-end[1])});
    }
  }
  if(!found)return [];
  let k=ek;const route=[b];while(k!==sk){k=parents.get(k);if(!k)return [];route.push(k.split(',').map(Number).map(v=>v/4));}route.reverse();
  const smooth=[origen.slice()];let from=0;
  while(from<route.length){let to=route.length-1;while(to>from&&!segmentoLibre(smooth[smooth.length-1],route[to]))to--;smooth.push(route[to]);from=to+1;}
  if(segmentoLibre(smooth[smooth.length-1],destino))smooth.push(destino.slice());
  return smooth.slice(1);
}

function cambiarEtapaSalida(g,etapa){g.salida.etapa=etapa;g.salida.tiempo=0;g.destino=null;g.rutaDestino=null;g.velocidad=0;}
function moverSalida(g,dt,reducido=false){
  const s=g.salida;if(!s||s.etapa==='terminado')return;
  if(reducido){terminarSalida(g);return;}
  s.tiempo+=dt;
  if(s.etapa==='volver'){
    if(Math.hypot(g.pos[0]-g.asiento[0],g.pos[1]-g.asiento[1])<.03){g.pos=g.asiento.slice();g.sentado=true;g.frente=true;cambiarEtapaSalida(g,'recoger');}
    else {g.sentado=false;g.destino=g.asiento.slice();g.velocidad=Math.min(.85,(g.velocidad||0)+2*dt);if(andarHacia(g,g.velocidad*dt)){if(Math.hypot(g.pos[0]-g.asiento[0],g.pos[1]-g.asiento[1])<.05)cambiarEtapaSalida(g,'recoger');else g.rutaDestino=null;}}
  }else if(s.etapa==='recoger'){
    g.sentado=true;g.frente=true;s.caja=s.tiempo>=.65;
    if(s.tiempo>=1.5){g.sentado=false;cambiarEtapaSalida(g,'levantarse');}
  }else if(s.etapa==='levantarse'){
    if(s.tiempo>=.45)cambiarEtapaSalida(g,'caminar');
  }else if(s.etapa==='caminar'){
    g.sentado=false;g.destino=PUERTA.slice();
    const distancia=Math.hypot(g.pos[0]-PUERTA[0],g.pos[1]-PUERTA[1]);
    const objetivo=Math.min(.82,Math.max(.2,distancia*1.6));
    g.velocidad=(g.velocidad||0)+Math.max(-2*dt,Math.min(2*dt,objetivo-(g.velocidad||0)));
    if(andarHacia(g,g.velocidad*dt)){
      // Si la ruta estuviera bloqueada, espera y vuelve a intentarlo; no desaparece lejos de la puerta.
      if(Math.hypot(g.pos[0]-PUERTA[0],g.pos[1]-PUERTA[1])<.05)cambiarEtapaSalida(g,'cruzar');
      else {g.destino=null;g.rutaDestino=null;}
    }
  }else if(s.etapa==='cruzar'){
    s.opacidad=Math.max(0,1-s.tiempo/.65);
    if(s.tiempo>=.65)terminarSalida(g);
  }
}

function andarHacia(g,v){
  const clave=g.destino.join(',');
  if(g.rutaDestino!==clave){g.ruta=calcularRuta(g.pos,g.destino);g.rutaDestino=clave;}
  if(!g.ruta.length){g.destino=g.pos.slice();return true;}
  let remaining=v;
  while(remaining>0&&g.ruta.length){
    const target=g.ruta[0],dx=target[0]-g.pos[0],dy=target[1]-g.pos[1],d=Math.hypot(dx,dy);
    if(d<=remaining){g.pos=target.slice();remaining-=d;g.ruta.shift();}
    else{g.pos[0]+=dx/d*remaining;g.pos[1]+=dy/d*remaining;remaining=0;}
    g.distanciaAndada=(g.distanciaAndada||0)+Math.min(d,v);
    if(d>.001){g.frente=dx+dy>0;g.derecha=dx-dy>0;}
  }
  return !g.ruta.length;
}
function moverAgentes(dt,f){
  for(const g of ESCENA.agentes){
    if(g.saliendo){
      if(!g.salida)iniciarSalida(g);
      moverSalida(g,dt,ESCENA.reducido);continue;
    }
    if(g.entrada&&g.entrada.etapa!=='terminado'){moverEntrada(g,dt,ESCENA.reducido);continue;}
    if(ESCENA.reducido){g.destino=null;g.rutaDestino=null;g.velocidad=0;g.pos=g.asiento.slice();g.sentado=true;continue;}
    if(f!=='cerrado'&&!g.sentado&&(!g.destino||g.destino[0]!==g.asiento[0]||g.destino[1]!==g.asiento[1])){
      g.destino=g.asiento.slice();g.rutaDestino=null;
    }
    if(f!=='cerrado'&&g.sentado){g.destino=null;g.rutaDestino=null;g.velocidad=0;continue;}
    if(g.destino){
      const distancia=Math.hypot(g.destino[0]-g.pos[0],g.destino[1]-g.pos[1]);
      const objetivo=Math.min(1.05,Math.max(.18,distancia*1.8));
      g.velocidad=(g.velocidad||0)+Math.max(-2.8*dt,Math.min(2.8*dt,objetivo-(g.velocidad||0)));
      if(andarHacia(g,g.velocidad*dt)){
        g.destino=null;g.rutaDestino=null;g.quieto=8+Math.random()*12;
        g.velocidad=0;
        g.sentado=Math.hypot(g.pos[0]-g.asiento[0],g.pos[1]-g.asiento[1])<.05;g.frente=true;
      }else g.sentado=false;
    }else if((g.quieto-=dt)<=0){
      const enPaseo=ESCENA.agentes.filter(a=>!a.sentado&&!a.saliendo).length;
      if(g.sentado&&enPaseo>=3){g.quieto=4+Math.random()*5;continue;}
      if(g.sentado){const sitios=Object.values(SITIOS),dest=sitios[Math.floor(Math.random()*sitios.length)];g.destino=dest.slice();}
      else g.destino=g.asiento.slice();
      g.sentado=false;g.rutaDestino=null;
      g.velocidad=0;
    }
  }
}

function minigrafico(a) {

  const diaNY = t => new Date(t).toLocaleDateString('sv-SE', { timeZone: 'America/New_York' });

  const activo = a.estado === 'activo' && a.periodo, hoy = activo ? a.hoy || [] : [], hoyDia = hoy.length > 1 ? diaNY(hoy[0][0]) : null;
  const minutos = d => EVOL && EVOL[d] && (EVOL[d].v[a.id] || []).some(v => v != null) ? EVOL[d] : null;
  const dias = a.historial.filter(p => !activo || p.fecha >= a.periodo.inicio).map(p => p.fecha);
  if (hoyDia && !dias.includes(hoyDia)) dias.push(hoyDia);

  dias.forEach((d, i) => {

function puntosAcciones(a, simbolos) {
  const primera = simbolos.map(s => (a.movs[s] || [[]])[0][0]).filter(Boolean).sort()[0] || '';

/* ---------- Gráficas a pantalla completa: la oficina, un equipo o un agente, de la última hora a todo su historial ---------- */
const FILTRO_GRAF = { eq: 'todos', quien: '' };
// «Si fuera real» vive dentro de Gráficas: dos vistas del mismo panel
const vistasGraf = () => `<div class="vistas-graf" role="group">${[['graficas', '📈 Agentes'], ['fondo', '🏦 Fondo'], ['real', '💶 Si fuera real']].map(([k, t]) => `<button data-vista="${k}" aria-pressed="${PANEL === k}">${t}</button>`).join('')}</div>`;
const atarVistas = el => el.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => { if (PANEL !== b.dataset.vista) abrirPanel(b.dataset.vista); });
const RANGOS = [['1H', '1H'], ['1D', '1D'], ['1S', '1S'], ['1M', '1M'], ['todo', 'Todo']];
let RANGO = '1D', EVOL = null;
cargarEvolucion().then(() => { if (typeof pintarPlantilla === 'function') pintarPlantilla(); });
async function cargarEvolucion() {
  if (EVOL) return EVOL;
  try { EVOL = await (await fetch('evolucion.json', { cache: 'no-store' })).json(); } catch (e) { EVOL = {}; }
  return EVOL;
}
// Los días de bolsa que entran en la ventana elegida: 1H y 1D el último, 1S los 5 últimos, 1M los de 30 días y Todo todos
function diasDelRango(fechas, rango) {
  if (rango === '1H' || rango === '1D') return fechas.slice(-1);
  if (rango === '1S') return fechas.slice(-5);
  if (rango === '1M' && fechas.length) { const desde = new Date(Date.parse(fechas[fechas.length - 1]) - 30 * 864e5).toISOString().slice(0, 10); return fechas.filter(f => f >= desde); }
  return fechas;

// Puntos de la ventana: [momento, {id: valor}, S&P, x]. Los días con datos minuto a minuto (los 5 últimos) van con todo
// su detalle y los anteriores con su cierre; cada día ocupa lo mismo en el eje x, así nada sale como una recta de día a día.
// Si la ventana abre con un día sin detalle, ese día también lleva el valor con el que empezó, para que se vea entero
function puntosGraf(ids, rango = RANGO) {
  const ref = Object.fromEntries(D.referencia.map(r => [r.fecha, r.precio]));
  const conMinutos = d => !!EVOL && !!EVOL[d] && ids.some(i => (EVOL[d].v[i] || []).some(v => v != null));
  const fechas = [...new Set([...ids.flatMap(i => [AG[i].periodo?.inicio, ...AG[i].historial.map(h => h.fecha)]).filter(Boolean), ...Object.keys(EVOL || {}).filter(conMinutos)])].sort();
  // Al cierre de un día: lo apuntado o, desde el inicio de su periodo hasta su primer apunte, el dinero con el que empezó
  const cierre = (id, d) => { const a = AG[id], h = a.historial.find(h => h.fecha === d); if (h) return h.valor;
    return a.periodo && d >= a.periodo.inicio && !a.historial.some(h => h.fecha < d) ? a.periodo.valor : undefined; };
  const antes = (id, d) => { const h = AG[id].historial.filter(h => h.fecha < d).pop(); return h ? h.valor : cierre(id, d); };
  const pts = [], dias = diasDelRango(fechas, rango);
  dias.forEach((d, i) => {
    if (conMinutos(d)) { const x = EVOL[d], n = x.t.length; x.t.forEach((t, k) => pts.push([t, Object.fromEntries(ids.map(id => [id, (x.v[id] || [])[k]])), x.ref[k], i + (k + 1) / n])); return; }
    if (i === 0) { const r = D.referencia.filter(r => r.fecha < d).pop();
      pts.push([d, Object.fromEntries(ids.map(id => [id, antes(id, d)])), r ? r.precio : AG[ids[0]].periodo?.referencia, 0]); }
    pts.push([d, Object.fromEntries(ids.map(id => [id, cierre(id, d)])), ref[d], i + 1]);
  });
  return ultimaHora(pts, rango);
}
const ultimaHora = (pts, rango) => {
  if (rango !== '1H' || !pts.length || pts[pts.length - 1][0].length <= 10) return pts;
  const fin = Date.parse(pts[pts.length - 1][0]); return pts.filter(p => Date.parse(p[0]) >= fin - 3600e3);
};
// Lo que valdría lo mismo metido en el S&P 500 desde el punto `ks` (antes, igual que el agente)
function serieSP(pts, ks, val) {
  const v0 = val[ks], r0 = pts[ks] && pts[ks][2];
  return { nombre: 'S&P 500', color: 'var(--sp)', sp: true, v: pts.map((p, k) => k < ks || !v0 || !r0 ? val[k] : p[2] ? v0 * p[2] / r0 : null) };
}
// Desde qué punto se compara un agente con el S&P 500. Antes de su primera operación no tenía nada invertido y las dos
// líneas van juntas. En el intradía cuenta desde la apertura de ese día (si tarda en entrar, es cosa suya); en el diario,
// que decide una vez a una hora fija, desde la hora a la que compró. Si empezó antes de la ventana, desde su principio
function inicioSP(pts, a) {
  const e = a.empezo, d = e && e.slice(0, 10);

  if (k < 0) return pts.length;
  if (pts[k][0].length <= 10 || pts[k][0].slice(0, 10) !== d) return Math.max(0, k - 1);
  if (a.equipo === 'intradia' || e.length <= 10) return k;
  let j = k; while (j + 1 < pts.length && pts[j + 1][0].slice(0, 10) === d && pts[j + 1][0] <= e) j++;
  return j;
}
const botonesRango = (rangos, actual, attr = 'rango') => `<div class="rangos" role="group">${rangos.map(([k, t]) => `<button data-${attr}="${k}" aria-pressed="${actual === k}">${t}</button>`).join('')}</div>`;
const sinDatos = () => `<p class="vacio">${RANGO === '1H' || RANGO === '1D' ? 'Aún no hay datos minuto a minuto de la última sesión.' : 'Aún no hay días suficientes para esta ventana.'}</p>`;

  const desde = !uno ? '' : ks >= pts.length ? ' · aún no ha invertido en esta ventana, así que las dos líneas van juntas'
    : ks > 0 ? ` desde que empezó a invertir${AG[uno].equipo === 'intradia' ? ' (desde la apertura de ese día)' : ''}; antes, las dos líneas van juntas` : ' desde el principio de la gráfica';

// Dibuja líneas en `caja` con su leyenda: `momentos` es el eje x (o `xs`, su posición) y cada serie trae un valor (o null) por momento
function dibujarGrafica(caja, leyenda, momentos, series, { base, baseTexto, xs, corto, largo }) {
  // Leyenda: cuánto ha cambiado cada uno en el periodo que se ve
  const cambio = s => { const v = s.v.filter(v => v != null); return v.length > 1 ? v[v.length - 1] / v[0] - 1 : null; };
  leyenda.innerHTML = series.map(s => { const c = cambio(s), u = s.v.filter(v => v != null).pop();
    return `<span><i style="border-top-color:${s.color}${s.sp ? ';border-top-style:dashed' : ''}"></i>${esc(s.nombre)} <b class="num">${u != null ? corto(u) : '—'}</b>${c != null ? ` <small class="${signo(c)}">${pct(c)}</small>` : ''}</span>`; }).join('')
    + (base == null ? '' : `<span><i style="border-top-color:var(--suave);border-top-style:dashed"></i>${baseTexto}</span>`);
  // Alto: lo que queda libre en el panel debajo de los botones y encima de la leyenda (en el móvil en horizontal es poco)
  const panel = document.getElementById('panel'), pr = panel.getBoundingClientRect(), estilo = getComputedStyle(panel);
  const libre = pr.bottom - parseFloat(estilo.paddingBottom) - caja.getBoundingClientRect().top - leyenda.offsetHeight - 22;
  const n = momentos.length, W = Math.max(300, caja.clientWidth), H = Math.round(Math.max(150, Math.min(460, libre))), L = 58, R = 10, T = 10, B = 26;
  const vals = series.flatMap(s => s.v).filter(v => v != null).concat(base == null ? [] : [base]);
  let min = Math.min(...vals), max = Math.max(...vals); const m = Math.max((max - min) * .08, max * 5e-4); min -= m; max += m;
  const pos = xs || momentos.map((_, k) => k), x0 = pos[0], x1 = pos[n - 1] > x0 ? pos[n - 1] : x0 + 1;
  const x = k => L + (pos[k] - x0) * (W - L - R) / (x1 - x0), y = v => T + (max - v) / (max - min) * (H - T - B);
  const cercano = px => { const objetivo = x0 + (px - L) / (W - L - R) * (x1 - x0); let k = 0; pos.forEach((p, j) => { if (Math.abs(p - objetivo) < Math.abs(pos[k] - objetivo)) k = j; }); return k; };
  const linea = s => { let d = '', pen = false; s.v.forEach((v, k) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; }); return d; };
  const variosDias = momentos[0].slice(0, 10) !== momentos[n - 1].slice(0, 10);
  const etiq = t => t.length <= 10 ? dia(t) : (variosDias ? dia(t) + ' ' : '') + hora(t);
  const ticksY = [0, 1, 2, 3].map(k => min + (max - min) * (k + .5) / 4);
  // Con varios días, una marca al empezar cada día (como mucho unas 6) y otra al final; con uno, repartidas
  const inicios = momentos.map((_, k) => k).filter(k => !k || momentos[k].slice(0, 10) !== momentos[k - 1].slice(0, 10)), paso = Math.ceil(inicios.length / 6);
  const ticksX = (variosDias ? [...new Set([...inicios.filter((_, j) => j % paso === 0), n - 1])]
    : [...new Set([0, .25, .5, .75, 1].map(u => cercano(L + u * (W - L - R))))])
    .filter((k, j, t) => j + 1 >= t.length || x(t[j + 1]) - x(k) >= 64);  // sin etiquetas montadas una encima de otra
  // En el eje, con varios días: la fecha la primera vez que aparece un día y después solo la hora
  const etiqEje = (k, j) => !variosDias ? etiq(momentos[k]) : (j && momentos[ticksX[j - 1]].slice(0, 10) === momentos[k].slice(0, 10) ? hora(momentos[k]) || dia(momentos[k]) : dia(momentos[k]));
  const lineaBase = base == null ? '' : `<line x1="${L}" x2="${W - R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--suave)" stroke-dasharray="4 4"/>`;
  caja.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${ticksY.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.06)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt0.format(v)}</text>`).join('')}
    ${ticksX.map((k, j) => `<text x="${x(k)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === n - 1 ? 'end' : 'middle'}">${etiqEje(k, j)}</text>`).join('')}
    ${lineaBase}${series.map(s => `<path d="${linea(s)}" fill="none" stroke="${s.color}" stroke-width="${s.sp ? 1.6 : 2}" ${s.sp ? 'stroke-dasharray="5 3"' : ''} stroke-linejoin="round"/>`).join('')}
    <line class="cursor-graf" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.35)" visibility="hidden"/></svg><div class="globo-graf" hidden></div>`;
  // Al pasar el dedo o el ratón: los valores de ese momento
  const svg = caja.querySelector('svg'), cur = caja.querySelector('.cursor-graf'), globo = caja.querySelector('.globo-graf');
  const mover = e => {
    const r = svg.getBoundingClientRect(), k = cercano((e.clientX - r.left) * W / r.width);
    cur.setAttribute('x1', x(k)); cur.setAttribute('x2', x(k)); cur.setAttribute('visibility', 'visible');
    globo.innerHTML = `<b>${etiq(momentos[k])}</b><br>` + series.filter(s => s.v[k] != null).sort((a, b) => b.v[k] - a.v[k]).map(s => `<span style="color:${s.color}">●</span> ${esc(s.nombre)} <b class="num">${largo(s.v[k])}</b>`).join('<br>');
    globo.hidden = false; const izq = x(k) * r.width / W; globo.style.left = (izq > r.width / 2 ? izq - globo.offsetWidth - 12 : izq + 12) + 'px';
  };
  svg.onpointermove = mover; svg.onpointerdown = mover; svg.onpointerleave = () => { globo.hidden = true; cur.setAttribute('visibility', 'hidden'); };
}

/* ---------- Si fuera real: la oficina con dinero de verdad desde el primer día ---------- */
const eur = x => fmt2.format(x) + ' €';
// Curva de «si fuera real», con las mismas ventanas que las demás gráficas: los días con datos minuto a minuto van con
// detalle (cada puesto se mueve en el día igual que la cartera de su agente y acaba en el valor del cálculo diario) y el resto con su cierre
function puntosReal(r) {
  const fuera = { momentos: [], xs: [], sin: [], con: [], sp: [] };
  const ultimo = a => { for (let k = a.length - 1; k >= 0; k--) if (a[k] != null) return a[k]; return null; };
  const elegidos = diasDelRango(r.dias.map(d => d.f), RANGO);
  r.dias.filter(d => elegidos.includes(d.f)).forEach((d, i) => {
    const x = (EVOL || {})[d.f];
    if (!x) { fuera.momentos.push(d.f); fuera.xs.push(i + 1); fuera.sin.push(d.sin); fuera.con.push(d.con); fuera.sp.push(d.sp); return; }
    const puestos = r.puestos.filter(p => p.serie && p.serie[d.f]).map(p => { const [id, fin] = p.serie[d.f], v = x.v[id] || [], u = ultimo(v); return { fin, v, u }; });
    const refFin = ultimo(x.ref), n = x.t.length;
    // Las comisiones se cobran a la hora de cada operación (las de sin hora, como los cierres automáticos, al final del día)
    const horasOps = D.operaciones.filter(o => o.fecha === d.f).map(o => Date.parse(o.hora || x.t[n - 1]));
    x.t.forEach((t, k) => {
      const sin = puestos.reduce((s, p) => s + (p.u && p.v[k] != null ? p.fin * p.v[k] / p.u : p.fin), 0);
      const pendientes = horasOps.filter(h => h > Date.parse(t)).length;
      fuera.momentos.push(t); fuera.xs.push(i + (k + 1) / n); fuera.sin.push(sin); fuera.con.push(sin - (d.sin - d.con) + pendientes * r.comision);
      fuera.sp.push(d.sp != null && refFin && x.ref[k] ? d.sp * x.ref[k] / refFin : null);
    });
  });
  if (RANGO === '1H' && fuera.momentos.length && fuera.momentos[fuera.momentos.length - 1].length > 10) {
    const fin = Date.parse(fuera.momentos[fuera.momentos.length - 1]), desde = fuera.momentos.findIndex(t => Date.parse(t) >= fin - 3600e3);
    for (const k in fuera) fuera[k] = fuera[k].slice(desde);
  }
  return fuera;
}

  // (se vuelve a pintar al terminar de abrirse el panel, cuando ya tiene su anchura de verdad)
  if (PANEL === 'graficas') { pintarGraficas(); setTimeout(() => { if (PANEL === 'graficas') pintarGraficas(); }, 350); }
  if (PANEL === 'acciones') { pintarGrafAcciones(); setTimeout(() => { if (PANEL === 'acciones') pintarGrafAcciones(); }, 350); }
  actualizarEnlace();
}
function ir(tab, extra) {
  if (tab === 'acciones') { ACC_ID = extra; return abrirPanel(tab); }
  abrirPanel(tab === 'oficina' ? null : tab);
  if (extra && AG[extra]) abrirFicha(extra);
}

document.getElementById('actualizado').textContent = D.actualizado
  ? 'Dinero ficticio · agentes actualizados el ' + new Date(D.actualizado + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
  : 'Dinero ficticio · los agentes empiezan en la próxima sesión';
pintarEstadoBolsa(); pintarPlantilla(); pintarPizarra(); pintarOperaciones(); pintarHoy(); crearEscena();
cargarNoticias();
document.querySelector('.dock').onclick = e => { const b = e.target.closest('button'); if (b) abrirPanel(PANEL === b.dataset.tab ? null : b.dataset.tab); };
document.getElementById('plegar').onclick = () => abrirPanel(null);
document.body.addEventListener('click', e => {
  const el = e.target.closest('[data-agente],[data-ir],[data-noticias-de],[data-acciones]');
  if (!el || el.closest('.dock')) return;
  e.preventDefault();
  if (el.dataset.noticiasDe) { FILTRO = { q: '', i: 'todas', m: 'todos', ti: 'todos', em: '', dia: '', usadas: true }; abrirPanel('noticias'); }
  else if (el.dataset.agente) abrirFicha(el.dataset.agente);
  else if (el.dataset.acciones) { ACC_ID = el.dataset.acciones; abrirPanel('acciones'); }
  else abrirPanel(el.dataset.ir);
});
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (FICHA_ID) cerrarFicha(); else if (PANEL) abrirPanel(null); });
function desdeEnlace() {
  let [tab, extra] = location.hash.replace(/^#\/?/, '').split('/');
  if (tab === 'analistas') tab = 'noticias';
  if (!tab || !(tab in TITULOS)) tab = 'oficina';
  ir(tab, extra && decodeURIComponent(extra));
}
window.addEventListener('hashchange', desdeEnlace);
desdeEnlace();
</script>
